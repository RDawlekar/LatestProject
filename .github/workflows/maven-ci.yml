name: Java CI with Maven

on:
  push:
    branches: [ "reshma-latest", "reshma-latest" ]
  pull_request:
    branches: [ "reshma-latest", "reshma-latest" ]
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  build-and-test:
    name: Build & Run Maven Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Temurin/Eclipse distribution)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven   # Automatically caches ~/.m2 based on pom.xml hash

      # Step 3: Run Maven tests
      - name: Run Tests with Maven
        run: mvn -B test --file pom.xml

      # Step 4: Upload Surefire test reports as artifacts (always runs, even on failure)
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7
